<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오 | 웹기획자</title>
  <meta name="description" content="웹기획자 개인 포트폴리오 — 진행한 프로젝트의 역할과 결과를 정리했습니다.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-header__name" href="index.html">
        <span class="dot" aria-hidden="true"></span>
        <span id="headerName">포트폴리오</span>
      </a>
      <nav class="site-header__nav" aria-label="주요 메뉴">
        <a class="site-header__link" href="#featured">주요 프로젝트</a>
        <a class="site-header__link" href="#others">그 외 프로젝트</a>
        <a class="site-header__link" href="#contact">연락처</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 소개 -->
    <section class="hero" aria-labelledby="heroTitle">
      <div class="wrap">
        <span class="hero__eyebrow" id="heroEyebrow">Web Service Planner</span>
        <h1 class="hero__title" id="heroTitle"></h1>
        <p class="hero__tagline" id="heroTagline"></p>
        <p class="hero__intro" id="heroIntro"></p>
        <dl class="hero__stats" id="heroStats"></dl>
        <div class="hero__actions" id="heroActions"></div>
      </div>
    </section>

    <!-- 상위 5개: 카드형 -->
    <section class="section" id="featured" aria-labelledby="featuredTitle">
      <div class="wrap">
        <div class="section__head">
          <div>
            <h2 class="section__title" id="featuredTitle">주요 프로젝트</h2>
            <p class="section__desc">기획 과정과 담당 역할을 함께 정리했습니다. 카드를 누르면 상세 내용을 볼 수 있습니다.</p>
          </div>
          <span class="section__count" id="featuredCount"></span>
        </div>
        <div class="card-grid" id="featuredGrid"></div>
      </div>
    </section>

    <!-- 하위 5개: 텍스트형 -->
    <section class="section" id="others" aria-labelledby="othersTitle">
      <div class="wrap">
        <div class="section__head">
          <div>
            <h2 class="section__title" id="othersTitle">그 외 참여 프로젝트</h2>
            <p class="section__desc">실제 운영 중인 사이트로 바로 이동해 결과물을 확인할 수 있습니다.</p>
          </div>
          <span class="section__count" id="othersCount"></span>
        </div>
        <ul class="link-list" id="linkList"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <div class="wrap site-footer__inner">
      <p id="footerContact" style="margin:0;"></p>
      <p id="footerCopy" style="margin:0;"></p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="assets/js/list.js"></script>
</body>
</html>
